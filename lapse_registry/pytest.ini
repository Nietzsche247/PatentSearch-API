[pytest]
# Registry API tests run without ES/MySQL/Redis/Supabase; found before the repo-root pytest.ini when the tests are named
# on the command line: LAPSE_REPO_DIR=<patentref checkout> python -m pytest lapse_registry/tests -q
addopts = -p no:cacheprovider
filterwarnings =
    ignore:No directory at
    ignore:The HMAC key
