        - ApiKeyAuth: [ ]
      operationId: listPatents
      description: ''
      parameters:
        - in: query
          name: f
          schema:
            type: string
            default: "[ \"patent_number\", \"patent_title\", \"patent_date\" ]"
        - in: query
          name: o
          schema:
            type: string
            default: "{ \"size\": 100,\"offset\": 0 }"
        - in: query
          name: q
          schema:
            type: string
          required: true
        - in: query
          name: s
          schema:
            type: string
            default: "[{ \"patent_number\": \"asc\" }]"
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatentSuccessResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
          description: 'Request Invalid'
          headers:
            X-Status-Reason:
              schema:
                type: string
              description: Description of invalid query
            X-Status-Reason-Code:
              schema:
                type: string
              description: Request Error Code
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottleResponse'
          description: 'Too many requests'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Number of seconds to wait before sending next request
      tags:
        - Patent
    post:
      security:
        - ApiKeyAuth: [ ]
      operationId: listPatentsList
      description: ''
