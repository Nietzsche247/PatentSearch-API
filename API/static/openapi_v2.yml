components:
  schemas:
    BadRequestResponse:
      type: object
      properties:
        error:
          type: boolean
      required:
        - error
    UnauthenticatedRequestResponse:
      type: object
      properties:
        detail:
          type: string
      required:
        - detail
    ThrottleResponse:
      type: object
      properties:
        detail:
          type: string
      required:
        - detail
    APISuccessResponse:
      type: object
      properties:
        error:
          type: boolean
          example: false
        count:
          type: integer
          example: 100
        total_hits:
